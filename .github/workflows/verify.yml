name: Verify Full Stack
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-startup:
    runs-on: windows-2025
    timeout-minutes: 8
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Check the Windows database lifecycle
        shell: powershell
        run: |
          if (!(Test-Path "$env:PGBIN/initdb.exe")) { throw 'PostgreSQL binaries are missing from this runner.' }
          $env:PATH = "$env:PGBIN;$env:PATH"
          & ./scripts/check-windows-startup.ps1
      - name: Preserve startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-startup-reports
          if-no-files-found: ignore
          path: .runtime/*.log
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: diagram_studio
          POSTGRES_USER: diagram
          POSTGRES_PASSWORD: diagram_ci_only
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U diagram -d diagram_studio"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      DB_URL: jdbc:postgresql://localhost:55432/diagram_studio
      STUDIO_TEST_DB_URL: jdbc:postgresql://localhost:55432/diagram_studio
      DB_USER: diagram
      DB_PASSWORD: diagram_ci_only
      CI: 'true'
      # Dedicated Java tests exercise the lower production-style rate limit.
      AUTH_MAX_ATTEMPTS: '200'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Install and check frontend
        run: |
          npm ci
          npm test
          node scripts/generate-openapi.mjs
          git diff --exit-code -- api/openapi.json
          npm run build
      - name: Java unit and PostgreSQL integration tests
        run: |
          node scripts/test-mailbox.mjs > mailbox.log 2>&1 &
          cd backend
          bash mvnw -B --no-transfer-progress verify -Pintegration
      - name: Start packaged application
        run: |
          java -jar backend/target/diagram-studio-1.0.0.jar > backend.log 2>&1 &
          node scripts/wait-for-api.mjs
      - name: API regression checks
        run: npm run test:api
      - name: Browser regression checks
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Check packaged release routes and assets
        run: npm run test:release
      - name: Build and smoke-check the container release
        run: |
          docker build -t diagram-studio:ci .
          test "$(docker image inspect --format '{{.Config.User}}' diagram-studio:ci)" = studio
          docker run -d --name diagram-studio-image --network host -e DB_URL -e DB_USER -e DB_PASSWORD -e SERVER_PORT=8094 -e MANAGEMENT_PORT=8095 diagram-studio:ci
          API_URL=http://127.0.0.1:8094/api node scripts/wait-for-api.mjs
          APP_URL=http://127.0.0.1:8094 npm run test:release
      - name: Preserve container diagnostics
        if: always()
        run: |
          docker logs diagram-studio-image > container.log 2>&1 || true
          docker rm -f diagram-studio-image || true
      - name: Preserve diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          if-no-files-found: ignore
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
            test-results/
            .runtime/design-*.png
            backend.log
            container.log
