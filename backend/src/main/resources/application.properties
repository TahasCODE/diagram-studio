spring.application.name=diagram-studio
debug=false
logging.level.root=INFO
logging.level.org.springframework=INFO
server.port=${SERVER_PORT:8090}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:55432/diagram_studio}
spring.datasource.username=${DB_USER:diagram}
spring.datasource.password=${DB_PASSWORD:diagram_local_only}
spring.datasource.hikari.maximum-pool-size=10
spring.flyway.enabled=true
spring.session.jdbc.initialize-schema=never
spring.session.timeout=7d
server.servlet.session.cookie.name=DIAGRAM_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.error.include-message=never
server.error.include-stacktrace=never
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=1MB
server.tomcat.max-http-form-post-size=1MB
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=2000
spring.jdbc.template.query-timeout=5s
studio.auth-rate-limit.max-attempts=${AUTH_MAX_ATTEMPTS:30}
studio.auth-rate-limit.window=${AUTH_RATE_WINDOW:PT15M}
studio.ops.username=${STUDIO_OPS_USERNAME:metrics}
studio.ops.password=${STUDIO_OPS_PASSWORD:}
management.server.port=${MANAGEMENT_PORT:8091}
management.server.address=${MANAGEMENT_ADDRESS:127.0.0.1}
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=OPERATOR
management.metrics.tags.application=diagram-studio
logging.pattern.level=%5p [requestId=%X{requestId:-}]
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [requestId=%X{requestId:-}] %logger{36} - %msg %kvp%n%ex
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestResponseBodyMethodProcessor=INFO
logging.level.org.springframework.web.servlet.mvc.method.annotation.HttpEntityMethodProcessor=INFO
